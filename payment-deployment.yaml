apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: payments

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: nginx-does-not-exist:999
          ports:
            - containerPort: 80
